name: Production smoke monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://eventloom.co
      INCIDENT_TITLE: "Production smoke monitor failed"
      READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
    steps:
      - name: Check public production journey
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > smoke.log

          check_status() {
            local path="$1"
            local expected="$2"
            local status
            status="$(curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 25 --silent --show-error --output response.body --write-out '%{http_code}' "${BASE_URL}${path}")"
            printf '%s -> %s\n' "$path" "$status" | tee -a smoke.log
            test "$status" = "$expected"
          }

          check_contains() {
            local path="$1"
            local text="$2"
            curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 25 --fail --silent --show-error "${BASE_URL}${path}" |
              tee response.body |
              grep --fixed-strings --quiet "$text"
            printf '%s contains expected marker\n' "$path" | tee -a smoke.log
          }

          check_status "/api/health/live" "200"
          check_status "/api/health/ready" "404"
          check_status "/examples/wedding" "404"
          check_status "/demo-wedding" "404"

          readiness_status="$(curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 25 --silent --show-error --output readiness.body --write-out '%{http_code}' --header "Authorization: Bearer ${READINESS_TOKEN}" "${BASE_URL}/api/health/ready")"
          test "$readiness_status" = "200" || test "$readiness_status" = "503"
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("readiness.body", "utf8"));
            const required = ["database", "stripe", "vercel", "turnstile", "fulfillmentQueue", "privacyQueue", "feedbackQueue", "maintenance"];
            if (!body.checks || required.some((key) => typeof body.checks[key] !== "boolean")) process.exit(1);
          '
          printf 'private readiness contract verified\n' | tee -a smoke.log

          check_contains "/" "Creative event websites"
          check_contains "/signup?next=%2Fapp%2Fevents%2Fnew%3Fbrief%3DSmoke%2520test%2520event" 'data-signup-ux="continue-draft-v2"'
          check_contains "/robots.txt" "Sitemap:"

          published_login="$(curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 25 --silent --show-error --output /dev/null --write-out '%{redirect_url}' "${BASE_URL}/app?status=published")"
          printf '/app?status=published -> %s\n' "$published_login" | tee -a smoke.log
          test "$published_login" = "${BASE_URL}/login?next=%2Fapp%3Fstatus%3Dpublished"

          profile_login="$(curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 25 --silent --show-error --output /dev/null --write-out '%{redirect_url}' "${BASE_URL}/app/profile")"
          printf '/app/profile -> %s\n' "$profile_login" | tee -a smoke.log
          test "$profile_login" = "${BASE_URL}/login?next=%2Fapp%2Fprofile"

      - name: Open or update incident
        if: steps.checks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${INCIDENT_TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          body="$(printf 'Automated production checks failed at %s.\\n\\nWorkflow: %s/actions/runs/%s\\n\\n```text\\n%s\\n```' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat smoke.log)")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$INCIDENT_TITLE" --body "$body"
          fi
          exit 1

      - name: Close recovered incident
        if: steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${INCIDENT_TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Production smoke checks recovered automatically at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
